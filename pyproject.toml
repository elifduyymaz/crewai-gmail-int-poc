[project]
name = "mail-ingestor"
version = "0.1.0"
description = "Framework-agnostic Gmail-ingestion PoC core for the CrewAI framework-selection spike."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.119.0",
    "crewai==1.15.1",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mail-ingestor = "mail_ingestor.main:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
